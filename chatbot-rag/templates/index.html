<!DOCTYPE html>
<html lang="en">

<head>
    <title>AI RAG Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="chat-container">
        <div class="chat-header">🤖 Wildlife bot</div>

        <!-- Chat Display -->
        <div id="chatbox"></div>

        <!-- Input Section -->
        <div class="input-container">
            <input id="user-input" placeholder="Ask something..." />
            <select id="language-select">
                <option value="en">English</option>
                <option value="hi">हिन्दी (Hindi)</option>
            </select>
            <button onclick="sendMessage()">Send 🚀</button>
        </div>
    </div>

    <script>
        // Function to convert basic Markdown syntax to HTML
        function markdownToHtml(markdown) {
            markdown = markdown
                // Bold (**text** or __text__)
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/__(.*?)__/g, '<strong>$1</strong>')
                // Italics (*text* or _text_)
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/_(.*?)_/g, '<em>$1</em>')
                // Bullet Points (- or *)
                .replace(/^- (.*?)(\n|$)/gm, '<li>$1</li>')
                .replace(/\n<li>/g, '<ul><li>')
                .replace(/<\/li>(?!\n<li>)/g, '</li></ul>')
                // Line Breaks (preserve new lines)
                .replace(/\n/g, '<br>');
            return markdown;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const languageSelect = document.getElementById('language-select');
            const chatbox = document.getElementById('chatbox');

            const userMessage = input.value.trim();
            const language = languageSelect.value;
            if (!userMessage) return;

            // Add user message to chat
            const userMessageDiv = document.createElement('div');
            userMessageDiv.classList.add('user-msg');
            userMessageDiv.textContent = userMessage;
            chatbox.appendChild(userMessageDiv);

            // Add initial loading message
            const loadingMessageDiv = document.createElement('div');
            loadingMessageDiv.classList.add('loading-msg');
            loadingMessageDiv.textContent = "Thinking... ⏳";
            chatbox.appendChild(loadingMessageDiv);

            chatbox.scrollTop = chatbox.scrollHeight;

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: userMessage, language: language })
                });

                const data = await response.json();

                // Update loading message for translation if needed
                if (language !== "en") {
                    loadingMessageDiv.textContent = "Translating... 🌐";
                }

                // Simulate translation delay for a better user experience
                await new Promise(resolve => setTimeout(resolve, 1500));

                // Remove loading message
                chatbox.removeChild(loadingMessageDiv);

                // Add bot response with Markdown support
                const botMessageDiv = document.createElement('div');
                botMessageDiv.classList.add('bot-msg');
                botMessageDiv.innerHTML = markdownToHtml(data.response);
                chatbox.appendChild(botMessageDiv);

            } catch (error) {
                console.error("Error fetching response:", error);
                loadingMessageDiv.textContent = "Error occurred. Try again! ❌";
            }

            // Clear input and scroll to bottom
            input.value = "";
            chatbox.scrollTop = chatbox.scrollHeight;
        }
    </script>

</body>

</html>
