<!DOCTYPE html>
<html lang="en">

<head>
    <title>AI RAG Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="chat-container">
        <div class="chat-header">🤖 RAG Chatbot</div>

        <!-- Chat Display -->
        <div id="chatbox"></div>

        <!-- Input Section -->
        <div class="input-container">
            <input id="user-input" placeholder="Ask something..." />
            <button onclick="sendMessage()">Send 🚀</button>
        </div>
    </div>

    <script>
        // Function to convert basic Markdown syntax to HTML
        function markdownToHtml(markdown) {
            // Bold (**text** or __text__)
            markdown = markdown.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            markdown = markdown.replace(/__(.*?)__/g, '<strong>$1</strong>');

            // Italics (*text* or _text_)
            markdown = markdown.replace(/\*(.*?)\*/g, '<em>$1</em>');
            markdown = markdown.replace(/_(.*?)_/g, '<em>$1</em>');

            // Bullet Points (- or *)
            markdown = markdown.replace(/^- (.*?)(\n|$)/gm, '<li>$1</li>');
            markdown = markdown.replace(/\n<li>/g, '<ul><li>');
            markdown = markdown.replace(/<\/li>(?!\n<li>)/g, '</li></ul>');

            // Line Breaks (preserve new lines)
            markdown = markdown.replace(/\n/g, '<br>');

            return markdown;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatbox = document.getElementById('chatbox');

            const userMessage = input.value.trim();
            if (!userMessage) return;

            // Add user message
            const userMessageDiv = document.createElement('div');
            userMessageDiv.classList.add('user-msg');
            userMessageDiv.textContent = userMessage;
            chatbox.appendChild(userMessageDiv);

            // Add loading message
            const loadingMessageDiv = document.createElement('div');
            loadingMessageDiv.classList.add('loading-msg');
            loadingMessageDiv.textContent = "Thinking... ⏳";
            chatbox.appendChild(loadingMessageDiv);

            chatbox.scrollTop = chatbox.scrollHeight;

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: userMessage })
                });

                const data = await response.json();

                // Remove loading message
                chatbox.removeChild(loadingMessageDiv);

                // Add bot response with Markdown support
                const botMessageDiv = document.createElement('div');
                botMessageDiv.classList.add('bot-msg');
                botMessageDiv.innerHTML = markdownToHtml(data.response); // Render Markdown
                chatbox.appendChild(botMessageDiv);

            } catch (error) {
                console.error("Error fetching response:", error);
                loadingMessageDiv.textContent = "Error occurred. Try again! ❌";
            }

            // Clear input and scroll to bottom
            input.value = "";
            chatbox.scrollTop = chatbox.scrollHeight;
        }
    </script>

</body>

</html>
