<!DOCTYPE html>
<html lang="en">

<head>
    <title>AI RAG Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="chat-container">
        <div class="chat-header">🤖 RAG Chatbot</div>

        <!-- Chat Display -->
        <div id="chatbox"></div>

        <!-- Input Section -->
        <div class="input-container">
            <input id="user-input" placeholder="Ask something..." />
            <button onclick="sendMessage()">Send 🚀</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatbox = document.getElementById('chatbox');

            // Add user message
            chatbox.innerHTML += `<div class="user-msg"> ${input.value}</div>`;

            // Send user input to backend
            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: input.value })
            });

            const data = await response.json();

            // Add bot response
            chatbox.innerHTML += `<div class="bot-msg">${data.response}</div>`;

            // Clear input & scroll to bottom
            input.value = "";
            chatbox.scrollTop = chatbox.scrollHeight;
        }
    </script>

</body>

</html>
